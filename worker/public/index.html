<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10283d"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"><title>StackChan 随行</title></head>
<body><main><header><div class="logo">◉</div><div><p class="eyebrow">STACKCHAN · 随行</p><h1>你的机器人，随时连接</h1></div></header>
<section class="card"><div class="row"><h2>连接机器人</h2><span id="connection" class="badge">尚未连接</span></div><label for="token">连接密钥</label><div class="row"><input id="token" type="password" autocomplete="off" placeholder="输入你的专属连接密钥"><button id="connect">连接</button></div><p class="hint">密钥只保留在当前页面，关闭页面后需要重新输入。</p><p id="message" role="status" aria-live="polite">连接后即可调整姿态与设备设置。</p></section>
<section class="card"><div class="row"><h2>转头看向</h2><span id="angles" class="badge">—</span></div><div class="pad"><button data-move="up" aria-label="抬头">↑</button><button data-move="left" aria-label="向左转头">←</button><button id="center">回正</button><button data-move="right" aria-label="向右转头">→</button><button data-move="down" aria-label="低头">↓</button></div><div class="row actions"><button data-gesture="nod">点头</button><button data-gesture="shake">摇头</button><button data-gesture="release">恢复自动动作</button></div></section>
<section class="card"><div class="row"><h2>和小智说话</h2><span id="chat-state" class="badge">—</span></div><div id="chat-log" class="chatlog" aria-live="polite"></div><label for="chat-input">想说的话（最多 300 字）</label><div class="row"><input id="chat-input" type="text" maxlength="300" autocomplete="off" placeholder="点这里输入你想说的话"><button id="chat-send">发送</button></div><div class="row actions"><button id="chat-cancel" class="secondary">取消本轮</button></div><p class="hint">机器人用原来的角色和声音回答；这里只显示文字，回复也会从机器人喇叭播出来。</p></section>
<section class="card"><div class="row"><h2>看看周围</h2><span id="camera-state" class="badge">—</span></div><div class="camera"><img id="snapshot" alt="机器人摄像头画面" hidden><p id="snapshot-hint" class="hint">点“拍一张”让机器人用摄像头拍下它面前的环境；照片通过加密通道回传，不在云端保存。</p></div><div class="row actions"><button id="snap">拍一张</button><button id="snap-live" class="secondary">连续看</button></div><p class="hint">连续看每 5 秒刷新一次，可随时停止；刷新期间机器人无法同时执行其他动作。</p></section>
<section class="card"><h2>设备设置</h2><label for="volume">音量 <output id="volume-value">—</output></label><input id="volume" type="range" min="0" max="100" value="50"><label for="brightness">屏幕亮度 <output id="brightness-value">—</output></label><input id="brightness" type="range" min="5" max="100" value="50"><button id="refresh" class="secondary">刷新设备状态</button></section>
<footer>远程控制联调版 · 加密摄像头已接入，小智聊天将在后续接入</footer></main><script type="module" src="/app.js"></script></body></html>
